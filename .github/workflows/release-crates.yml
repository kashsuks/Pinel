name: Release Crates

on:
  workflow_call:
    inputs:
      release_channel:
        required: true
        type: string
      publish_version:
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - name: Adjust version for dev publish
        if: inputs.release_channel == 'dev'
        shell: bash
        run: |
          perl -0pi -e 's/^version = "[^"]*"/version = "${{ inputs.publish_version }}"/m' Cargo.toml

      - name: Publish to crates.io
        shell: bash
        run: |
          cargo login "${{ secrets.CRATES_IO }}"

          # pinel depends on the in-tree editor fork by version, so a new
          # editor version has to reach crates.io before pinel can publish.
          editor_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/iced-code-editor/Cargo.toml | head -n1)
          if curl -sf -A "pinel-release (github.com/kashsuks/Pinel)" \
            "https://crates.io/api/v1/crates/pinel-code-editor/${editor_version}" >/dev/null; then
            echo "pinel-code-editor ${editor_version} is already on crates.io"
          else
            cargo publish -p pinel-code-editor
          fi

          cargo publish -p pinel --allow-dirty
          rm -f ~/.cargo/credentials
