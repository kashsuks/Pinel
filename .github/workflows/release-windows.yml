name: Release Windows

on:
  workflow_call:
    inputs:
      binary_name:
        required: true
        type: string
      release_tag:
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set embedded release version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python_cmd=python
          if ! command -v python >/dev/null; then python_cmd=python3; fi
          "$python_cmd" - <<'PYTHON'
          import os
          import pathlib
          import re

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          path = pathlib.Path("Cargo.toml")
          content, count = re.subn(r'^version = "[^"\n]+"', f'version = "{version}"', path.read_text(), count=1, flags=re.MULTILINE)
          assert count == 1, "package version not found"
          path.write_text(content)
          PYTHON

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}

      - name: Prepare asset
        shell: bash
        run: |
          cp \
            target/x86_64-pc-windows-msvc/release/${{ inputs.binary_name }}.exe \
            target/${{ inputs.binary_name }}-windows-x86_64.exe

      - name: Upload asset to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: target/${{ inputs.binary_name }}-windows-x86_64.exe
          tag_name: ${{ inputs.release_tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
